# 台湾用词对照表（zh-Hant 专属）
#
# 这一层是**地区用词**，不是字形转换：字形（简→繁、裡/裏、為/爲）由引导时的
# OpenCC s2twp 一次性完成，之后不再重跑；这里只处理「简繁同形、但台湾用法
# 不同」的词（`程序` → `程式`、`重置` → `重設`、`交換機` → `交換器`）。
#
# `from` 写的是**覆盖层里的实际写法**（OpenCC 转换之后的繁体形式），因为本工具
# 读的是 `i18n/zh-Hant/**`，不是简体原文；`# 简体原文:` 只是给人看的对照。
#
# 两个读者：
#   1. `tools/translate/localize-zh-hant.mjs`（`npm run localize:hant`）按本表
#      对 `i18n/zh-Hant/**/*.md` 做幂等替换；
#   2. 人工审阅：`# review` 标注的词对是「有把握但值得再看一眼」的。
#      改完这里跑一次 `npm run localize:hant` 即生效，不需要模型。
#
# 规则：
#   - `from` 至少两个字；单字差异属于字形层，交给 OpenCC。
#   - 按 `from` 长度从长到短匹配，长词优先，避免 `資料包` 被 `資料` 先吃掉。
#   - 只替换正文：代码块、行内代码、链接地址、锚点、MDX 表达式一律跳过。
#   - 这是 zh-Hant 仓库自己的本地化层，**不是**通用机制：不要搬进 hub 或
#     `locale:add`。
#
# OpenCC 已经稳定换好的词（`客户端`→`客戶端`、`数据包`→`資料包`、`接口`→`介面`、
# `端口`→`埠`、`默认`→`預設`、`菜单`→`選單` …）不需要列在这里；只有转换后
# 仍留在正文里的写法才值得占一行。
